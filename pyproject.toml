[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screensmith"
version = "0.1.0"
description = "Display and scaling surgery for KDE Plasma, including the scale factors the settings GUI will not offer you"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["kde", "plasma", "kwin", "wayland", "display", "scaling", "hi-dpi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]

# No runtime dependencies on purpose: screensmith is a thin wrapper around
# kscreen-doctor and a few JSON/INI files, and a desktop utility that needs a
# virtualenv is a desktop utility nobody runs.
dependencies = []

[project.urls]
Homepage = "https://github.com/skchdf/screensmith"
Issues = "https://github.com/skchdf/screensmith/issues"

[project.scripts]
screensmith = "screensmith.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/screensmith"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
