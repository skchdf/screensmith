name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Screensmith supports 3.10+, and 3.14 is what it was developed on.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Test (unittest, the supported path)
        run: python -m unittest discover -s tests -t tests -v

      - name: Test (pytest, for local development)
        run: |
          python -m pip install pytest
          python -m pytest tests -q

      - name: Smoke test the installed entry point
        run: |
          screensmith --version
          # --help must work without a display or kscreen-doctor present.
          screensmith --help > /dev/null

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Ruff
        run: |
          python -m pip install ruff
          ruff check src tests
          ruff format --check src tests

      - name: Compile check
        run: python -m compileall -q src tests

  shell-completions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash completion parses
        run: bash -n completions/screensmith.bash

      - name: zsh completion parses
        run: |
          sudo apt-get update && sudo apt-get install -y zsh
          zsh -n completions/screensmith.zsh
